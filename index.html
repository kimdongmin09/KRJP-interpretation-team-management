                          <div>
                            <div className="flex items-center space-x-2 mb-1">
                              <span className="text-xs font-mono font-bold text-purple-700 bg-purple-50 px-2 py-0.5 rounded border border-purple-200">
                                {wf.wfId}
                              </span>
                              <span className={`text-[11px] px-2 py-0.5 rounded border font-semibold ${meta.badgeBg}`}>
                                {meta.name}
                              </span>
                              <span className="text-xs text-slate-400">신청부서: {wf.dept}</span>
                            </div>
                            <h4 className="text-sm font-bold text-slate-900">{wf.title}</h4>
                            <div className="text-xs text-slate-500 mt-1">
                              일시: {wf.date} {wf.timeStr} | 형태: {wf.reqType}
                            </div>
                          </div>

                          <div className="flex items-center space-x-2">
                            <button
                              onClick={() => handleApproveWorkflow(wf)}
                              className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-sm transition"
                            >
                              승인 및 캘린더 자동 등록
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* 4. 통역사 배정 & 상세 정보 모달 */}
          {activeModalMeeting && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-700">
                      회의 상세 & 통역사 배정
                    </span>
                    <h3 className="text-base font-bold text-slate-900 mt-1">{activeModalMeeting.title}</h3>
                    <p className="text-xs text-slate-500">
                      일시: {activeModalMeeting.date} {activeModalMeeting.startHour}:00 ~ {activeModalMeeting.endHour}:00
                    </p>
                  </div>
                  <button
                    onClick={() => setActiveModalMeeting(null)}
                    className="text-slate-400 hover:text-slate-600 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="border-t border-b border-slate-100 py-4 my-4">
                  <div className="text-xs font-bold text-slate-700 mb-2">담당 통역사 선택 (클릭하여 배정/해제)</div>
                  <div className="text-[11px] text-slate-500 mb-3">
                    * 한/일 페어 배정을 권장합니다. (KO 모국어 1명 + JA 모국어 1명)
                  </div>

                  <div className="max-h-56 overflow-y-auto space-y-3 pr-1">
                    {['regular1', 'regular2', 'urgent'].map(teamKey => {
                      const meta = TEAM_METAS[teamKey];
                      const members = interpreters.filter(i => i.team === teamKey);
                      return (
                        <div key={teamKey}>
                          <div className="text-[11px] font-bold text-slate-500 mb-1">{meta.name}</div>
                          <div className="grid grid-cols-2 gap-2">
                            {members.map(i => {
                              const isAssigned = (activeModalMeeting.interpreters || []).includes(i.code);
                              return (
                                <button
                                  key={i.id}
                                  onClick={() => handleToggleInterpreter(i.code)}
                                  className={`p-2 rounded-lg border text-left text-xs transition flex items-center justify-between ${
                                    isAssigned
                                      ? 'bg-purple-600 text-white border-purple-600 shadow-sm'
                                      : 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700'
                                  }`}
                                >
                                  <div>
                                    <span className="font-bold">【{i.code}】</span> {i.name}
                                  </div>
                                  <span className={`text-[10px] px-1 rounded ${
                                    isAssigned ? 'bg-purple-800 text-white' : 'bg-slate-100 text-slate-500'
                                  }`}>
                                    {i.lang}
                                  </span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="flex justify-end space-x-2">
                  <button
                    onClick={() => setActiveModalMeeting(null)}
                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl"
                  >
                    닫기
                  </button>
                  <button
                    onClick={() => {
                      alert('배정 상태가 저장되었습니다.');
                      setActiveModalMeeting(null);
                    }}
                    className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-sm"
                  >
                    배정 완료
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 5. REST API 규격서 모달 */}
          {showApiDocModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-100">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-base font-bold text-slate-900">
                    사내 전자결재(Workflow) REST API 연동 가이드
                  </h3>
                  <button onClick={() => setShowApiDocModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">
                    ✕
                  </button>
                </div>
                <p className="text-xs text-slate-500 mb-3">
                  사내 결재 시스템에서 최종 승인 완료(Approved) 이벤트 발생 시 아래 엔드포인트로 Webhook POST 요청을 전송합니다.
                </p>
                <div className="bg-slate-900 text-slate-100 p-3.5 rounded-xl text-xs font-mono overflow-x-auto mb-4">
                  <div className="text-emerald-400">// POST /api/v1/interprebridge/workflow/webhook</div>
                  {`{
  "event": "APPROVAL_COMPLETED",
  "workflow_id": "WF-20261110-091",
  "meeting_title": "[긴급/임원보고] C-Level 한일 비상 전략회의",
  "request_team": "urgent", // "regular1" | "regular2" | "urgent"
  "start_time": "2026-11-10T18:00:00+09:00",
  "end_time": "2026-11-10T19:30:00+09:00",
  "interpretation_type": "simultaneous",
  "department": "경영전략실"
}`}
                </div>
                <div className="flex justify-end">
                  <button
                    onClick={() => setShowApiDocModal(false)}
                    className="px-4 py-2 bg-purple-600 text-white text-xs font-bold rounded-xl"
                  >
                    확인
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 마운트
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
